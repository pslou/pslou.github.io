# Site configuration for Jekyll-driven notes
name: pslou.github.io
baseurl: ""
url: "https://paullou.me"
permalink: pretty
collections:
  notes:
    output: true
    permalink: /notes/:slug/
defaults:
  - scope:
      path: "blog"
    values:
      blog: true
  - scope:
      path: ""
      type: posts
    values:
      layout: blog_post
      permalink: /blog/:categories/:year/:month/:day/:title/
      blog: true
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      katex: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    block:
      line_numbers: false
excerpt_separator: '<!--more-->'
exclude:
  - cv
  - tools
  - node_modules
  - package.json
  - package-lock.json
  - README.md
